<!doctype html>
<html lang="en" data-theme="ledger-dark" data-accent="azure">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0e12" />
    <!-- The Conformiti mark (shield and check), Governance Blue. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Conformiti</title>
    <!-- No webfont is fetched. Every page of a self-hosted compliance product
         is served from the organisation's own network, and that includes the
         anonymous login screen and the vendor questionnaire link sent outside
         the company: a font request tells a third party the address of the
         installation, who is visiting it and when. Typography falls back to
         the platform's own UI faces (see tailwind.config.js). -->
    <!-- Applies the saved theme/accent before first paint (kept external for CSP). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
