<!doctype html>
<html lang="en" data-theme="conformiti" data-accent="azure">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b11" />
    <!-- The Conformiti mark (shield and check), Governance Blue. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Conformiti</title>
    <!-- No webfont is fetched from a third party. Every page of a self-hosted
         compliance product is served from the organisation's own network, and
         that includes the anonymous login screen and the vendor questionnaire
         link sent outside the company: a font request tells a third party the
         address of the installation, who is visiting it and when. The two
         faces (Nunito Sans, JetBrains Mono) are bundled with the app and served
         by the installation itself (see src/styles/index.css). -->
    <!-- Applies the saved theme/accent before first paint (kept external for CSP). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
