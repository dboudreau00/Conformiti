server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (inherited by locations without their own add_header) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Content-Security-Policy: scripts only from this origin (the theme
    # bootstrap lives in /theme-init.js, not inline), styles inline (React
    # style props) + Google Fonts, no framing, no plugins. If you self-host the
    # fonts, drop the two fonts.* entries.
    # 'wasm-unsafe-eval' is for pdf.js's image decoders (JPEG 2000, JBIG2),
    # which are WebAssembly modules shipped in this bundle; it permits no
    # JavaScript eval. blob: in img-src is the in-browser viewer's images.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Evidence uploads are policy documents, not avatars — nginx's 1 MB default
    # would 413 them before Django ever sees the request. Keep in step with
    # MAX_UPLOAD_MB in the backend.
    client_max_body_size 32m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Proxy the API and the Django admin to the backend service.
    location /api/ {
        proxy_pass http://backend:8000;
        # $http_host, not $host: $host drops the port, so Django would build
        # absolute file URLs like http://localhost/media/... and every document
        # download link would break whenever the app is served on a non-80 port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's admin/DRF static assets (collectstatic output). gunicorn does not
    # serve these — without this location the admin renders unstyled.
    location /static/ {
        alias /usr/share/nginx/static/;
        access_log off;
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Uploaded evidence is NOT publicly readable. Both locations below are
    # `internal`, so nginx refuses a request that comes from a client; they can
    # only be entered by an X-Accel-Redirect from the API, which has already
    # checked the caller's folder permissions and written an audit row.
    #
    # Before 0.3.0 /media/ was a plain alias. Upload paths are derived from the
    # folder tree and the file name, so anyone who could reach the site and
    # guess a path could read any document, with nothing recorded.
    #
    # The API sets Content-Disposition on every X-Accel response (attachment
    # for downloads, inline for previews) and nginx carries that header
    # through. It must NOT be added here as well: until 0.5.0 this location
    # appended a second "attachment" header, and a response with two
    # Content-Disposition headers is refused outright by Chromium
    # (ERR_RESPONSE_HEADERS_MULTIPLE_CONTENT_DISPOSITION) and Firefox -- every
    # download and preview through the SPA failed in the Docker stack.
    # The sandboxing CSP and X-Frame-Options stay: they are inert on the XHR
    # the SPA makes and protective on a direct navigation to the API URL.
    # (add_header is re-declared because nginx does not inherit them once a
    # location defines its own.)
    location /protected-media/ {
        internal;
        alias /usr/share/nginx/media/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # Kept only so that a link saved before 0.3.0 fails closed and visibly,
    # rather than silently serving the file.
    location /media/ {
        internal;
        alias /usr/share/nginx/media/;
    }
}
