server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (inherited by locations without their own add_header) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Content-Security-Policy: scripts only from this origin (the theme
    # bootstrap lives in /theme-init.js, not inline), styles inline (React
    # style props) + Google Fonts, no framing, no plugins. If you self-host the
    # fonts, drop the two fonts.* entries.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Evidence uploads are policy documents, not avatars — nginx's 1 MB default
    # would 413 them before Django ever sees the request. Keep in step with
    # MAX_UPLOAD_MB in the backend.
    client_max_body_size 32m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Proxy the API and the Django admin to the backend service.
    location /api/ {
        proxy_pass http://backend:8000;
        # $http_host, not $host: $host drops the port, so Django would build
        # absolute file URLs like http://localhost/media/... and every document
        # download link would break whenever the app is served on a non-80 port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's admin/DRF static assets (collectstatic output). gunicorn does not
    # serve these — without this location the admin renders unstyled.
    location /static/ {
        alias /usr/share/nginx/static/;
        access_log off;
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Uploaded evidence, served straight off the shared media volume. Django
    # only registers a /media/ route when DEBUG is on, so proxying here would
    # 404 in the documented production configuration (DJANGO_DEBUG=false).
    # Content-Disposition forces download so a malicious uploaded .html/.svg
    # can't execute as stored XSS in the app's origin. (add_header is re-declared
    # because nginx does not inherit them once a location defines its own.)
    location /media/ {
        alias /usr/share/nginx/media/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Disposition "attachment" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }
}
