# ClamAV daemon configuration for the Conformiti scanning profile.
#
# Mounted read-only into the `clamav` service by docker-compose.yml.

TCPSocket 3310
TCPAddr 0.0.0.0
Foreground yes
LogTime yes
MaxThreads 4

# The largest stream clamd will accept. Must be at least MAX_UPLOAD_MB (32) --
# the application refuses anything larger before it gets here, and its
# CLAMAV_MAX_MB default of 40 matches this number.
StreamMaxLength 40M
MaxFileSize 40M
MaxScanSize 200M
MaxRecursion 12
MaxFiles 5000

# The important one. ClamAV's default is `no`, which means content that trips
# any Max* limit is SKIPPED and answered "OK" -- so an archive crafted to blow
# the recursion limit would be stored carrying the claim that it was scanned.
# With this on, clamd reports Heuristics.Limits.Exceeded and the application
# refuses the file with a message that says why.
AlertExceedsMax yes

# Encrypted archives and documents cannot be inspected. Refuse them rather than
# storing something nobody has read: uploads.py already tells people to export
# to PDF instead.
AlertEncryptedArchive yes
AlertEncryptedDoc yes
