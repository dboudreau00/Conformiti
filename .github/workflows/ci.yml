name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Static validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/validate.py

  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      DJANGO_DEBUG: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Django system check
        run: python manage.py check
        working-directory: backend
      - name: Shipped migrations are complete
        run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      - name: Test suite
        run: python manage.py test --noinput -v 2
        working-directory: backend

  backend-postgres:
    name: Backend tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: compliance
          POSTGRES_USER: compliance
          POSTGRES_PASSWORD: compliance
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U compliance"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_DEBUG: "true"
      POSTGRES_DB: compliance
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: compliance
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python manage.py test --noinput
        working-directory: backend

  frontend:
    name: Frontend build + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config -q
      - run: docker build -t conformiti-backend:ci ./backend
      - run: docker build -t conformiti-frontend:ci ./frontend
      - name: Backend image boots and answers /api/health/ (SQLite, no services)
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DJANGO_DEBUG=false -e DJANGO_SECRET_KEY_FILE=/app/secrets/key \
            -e BEHIND_TLS=false -e SEED_DEMO_DATA=true -e EMAIL_PROVIDER=console \
            conformiti-backend:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health/; then echo; exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1

  e2e:
    name: End-to-end browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      # The suite starts the backend itself, from the repo-root venv the
      # Playwright config resolves.
      - run: python -m venv .venv && .venv/bin/pip install -r backend/requirements.txt
      - run: npm ci --no-fund --no-audit
        working-directory: frontend
      - run: npm ci --no-fund --no-audit
        working-directory: e2e
      - id: pw
        working-directory: e2e
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        working-directory: e2e
        if: steps.browsers.outputs.cache-hit == 'true'
      # Both authentication transports. The suite found three specs that had
      # quietly assumed the token was readable from localStorage.
      - run: npm test
        working-directory: e2e
        env:
          E2E_TRANSPORT: header
      - run: npm test
        working-directory: e2e
        env:
          E2E_TRANSPORT: cookie
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
          retention-days: 7

  # The stack as shipped, through nginx: sign in on the cookie transport,
  # upload evidence, read it back through X-Accel, back the installation up
  # with the shipped script, destroy it, restore it and read the same bytes
  # back. Until 0.9.5 nothing exercised the compose file end to end, and the
  # backup instructions in the README named a database user that did not
  # exist.
  compose:
    name: Compose stack, backup and restore
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEMO_PASSWORD: CiDemoPassword2026
      REDIS_PASSWORD: ciRedisSecret42
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack (Redis password on, demo data seeded)
        run: |
          printf 'DEMO_PASSWORD=%s\nREDIS_PASSWORD=%s\n' "$DEMO_PASSWORD" "$REDIS_PASSWORD" > .env
          docker compose up -d --build
      - name: nginx answers /api/health/
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8080/api/health/ > /tmp/health.json 2>/dev/null; then break; fi
            sleep 3
          done
          cat /tmp/health.json; echo
          jq -e '.status == "ok" and .database == "ok"' /tmp/health.json > /dev/null
          docker compose ps
      - name: Sign in through nginx, upload a document, download it through X-Accel
        run: |
          set -euo pipefail
          jar=/tmp/cookies.txt
          curl -fsS -c "$jar" -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$DEMO_PASSWORD\"}" \
            http://localhost:8080/api/auth/token/ > /tmp/login.json
          # Cookie mode keeps the tokens out of the body; only the CSRF token is readable.
          if grep -q '"access"' /tmp/login.json; then echo "tokens leaked into the login body"; exit 1; fi
          csrf=$(awk '$6 == "csrftoken" {print $7}' "$jar")
          test -n "$csrf"
          folder=$(curl -fsS -b "$jar" http://localhost:8080/api/folders/tree/ | jq -r '.[0].id')
          test "$folder" != "null"
          head -c 65536 /dev/urandom > /tmp/evidence.bin
          doc=$(curl -fsS -b "$jar" -H "X-CSRFToken: $csrf" \
            -F "folder=$folder" -F "name=CI evidence" -F "file=@/tmp/evidence.bin;filename=evidence.bin" \
            http://localhost:8080/api/documents/ | jq -r '.id')
          test "$doc" != "null"
          echo "doc=$doc" >> "$GITHUB_ENV"
          curl -fsS -b "$jar" -D /tmp/dl.headers -o /tmp/dl.bin "http://localhost:8080/api/documents/$doc/download/"
          cmp /tmp/evidence.bin /tmp/dl.bin
          grep -qi '^content-disposition: attachment' /tmp/dl.headers
          if grep -qi '^x-accel-redirect' /tmp/dl.headers; then echo "nginx passed the X-Accel header through"; exit 1; fi
          # The file is served by nginx from the internal location, never by gunicorn.
          curl -s -o /dev/null -w '%{http_code}\n' http://localhost:8080/protected-media/ | grep -q '^404$'
          curl -fsS -b "$jar" http://localhost:8080/api/signing-keys/ > /tmp/keys-before.json
      - name: Back up with the shipped script
        run: |
          scripts/backup.sh /tmp/backup
          for f in db.sql.gz media.tgz secrets.tgz tree.tgz; do test -s "/tmp/backup/$f"; done
          tar tzf /tmp/backup/secrets.tgz | grep -q package_signing_key
      - name: Destroy the installation and restore it
        run: |
          docker compose down -v
          scripts/restore.sh /tmp/backup
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8080/api/health/ > /dev/null 2>&1; then break; fi
            sleep 3
          done
          docker compose ps
      - name: The document is back byte for byte, under the same signing key
        run: |
          set -euo pipefail
          jar=/tmp/cookies2.txt
          curl -fsS -c "$jar" -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$DEMO_PASSWORD\"}" \
            http://localhost:8080/api/auth/token/ > /dev/null
          curl -fsS -b "$jar" -o /tmp/dl2.bin "http://localhost:8080/api/documents/$doc/download/"
          cmp /tmp/evidence.bin /tmp/dl2.bin
          curl -fsS -b "$jar" http://localhost:8080/api/signing-keys/ > /tmp/keys-after.json
          cmp /tmp/keys-before.json /tmp/keys-after.json
      - name: Logs
        if: failure()
        run: docker compose logs --no-color | tail -n 400
