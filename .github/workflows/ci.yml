name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Static validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/validate.py

  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      DJANGO_DEBUG: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Django system check
        run: python manage.py check
        working-directory: backend
      - name: Shipped migrations are complete
        run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      - name: Test suite
        run: python manage.py test --noinput -v 2
        working-directory: backend

  backend-postgres:
    name: Backend tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: compliance
          POSTGRES_USER: compliance
          POSTGRES_PASSWORD: compliance
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U compliance"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_DEBUG: "true"
      POSTGRES_DB: compliance
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: compliance
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python manage.py test --noinput
        working-directory: backend

  frontend:
    name: Frontend build + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # Vite builds an undeclared name as a global, so a build is no proof.
      - name: Every source file parses and uses no undeclared name
        run: node ../tools/jscheck.mjs src
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  # Nothing ran the installers here, which is how two defects that stopped
  # every run of install.ps1 shipped from 0.9.5b to 0.9.5k: a variable that
  # PowerShell's case-insensitive names made into the -Demo switch, and npm's
  # npm.ps1 shim, which received none of its arguments. Both Windows shells,
  # because they are where the two differ. The second run is a returning
  # user's with the demo on, and its banner has to repeat the password
  # bootstrap_demo printed.
  installer-windows:
    name: Installer on Windows (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: Windows PowerShell 5.1
            installer: powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
          - shell: PowerShell 7
            installer: pwsh -NoProfile -File .\install.ps1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # "22" resolves to the newest 22.x, which is past the 22.12 Vite 8 needs.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install.ps1 -SetupOnly on a fresh checkout
        run: ${{ matrix.installer }} -SetupOnly
      - name: Django system check on what it installed
        run: ..\.venv\Scripts\python.exe manage.py check
        working-directory: backend
      - name: Again with -Demo, and the banner repeats the password
        env:
          DEMO_PASSWORD: CiDemoPassword2026
        run: |
          ${{ matrix.installer }} -SetupOnly -Demo | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $plain = $out -replace '\x1b\[[0-9;]*m', ''
          if (-not ($plain -match '^\s*Password:\s+CiDemoPassword2026\b')) {
            Write-Output "the setup banner does not repeat the demo password"
            exit 1
          }
      # A creation that stopped part way leaves a .venv with a python.exe and
      # no pip. The installer has to rebuild that, not die at its pip step on
      # every later run.
      - name: A half-created .venv is rebuilt, not reused
        run: |
          if (Test-Path .venv) { Remove-Item -Recurse -Force .venv }
          python -m venv --without-pip .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ${{ matrix.installer }} -SetupOnly | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($out -match 'the existing \.venv has no working pip')) {
            Write-Output "install.ps1 did not say it rebuilt the half-created .venv"
            exit 1
          }
          .venv\Scripts\python.exe -m pip --version

  installer-linux:
    name: Installer on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install.sh --setup-only on a fresh checkout
        run: ./install.sh --setup-only
      - name: Django system check on what it installed
        run: ../.venv/bin/python manage.py check
        working-directory: backend
      - name: Again with --demo, and the banner repeats the password
        env:
          DEMO_PASSWORD: CiDemoPassword2026
        run: |
          set -euo pipefail
          ./install.sh --setup-only --demo | tee /tmp/demo.log
          # A here-string, not a pipe, for the reason the docker job gives.
          grep -Eq '^ *Password:? +CiDemoPassword2026( |$)' <<< "$(sed 's/\x1b\[[0-9;]*m//g' /tmp/demo.log)" \
            || { echo "the setup banner does not repeat the demo password"; exit 1; }
      # Run mode, stopped the way a user stops it. The old trap signalled its
      # own process group from inside the handler, ran again on every TERM it
      # sent, and ended in a segmentation fault after thousands of lines. A
      # terminal of its own, because Ctrl-C is the terminal's doing: the 0x03
      # written to it becomes a SIGINT for the installer's process group.
      - name: Ctrl-C in run mode stops both servers, once, and exits 0
        env:
          CONFORMITI_DEV_API_PORT: "18000"
          CONFORMITI_DEV_PORT: "18001"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pty, re, select, signal, subprocess, sys, time

          api = os.environ["CONFORMITI_DEV_API_PORT"]
          web = os.environ["CONFORMITI_DEV_PORT"]
          leftover = [f"runserver 127.0.0.1:{api}", "vite"]
          pid, fd = pty.fork()
          if pid == 0:
              os.execv("./install.sh", ["./install.sh"])
          transcript = bytearray()

          def pump(seconds):
              """Copy what the installer wrote into the log; False at end of file."""
              if not select.select([fd], [], [], seconds)[0]:
                  return True
              try:
                  data = os.read(fd, 65536)
              except OSError:  # EIO: nothing holds the terminal open any more
                  return False
              transcript.extend(data)
              sys.stdout.buffer.write(data)
              sys.stdout.flush()
              return bool(data)

          def answers(url):
              return subprocess.run(["curl", "-s", "-o", "/dev/null", "--max-time", "2", url]).returncode == 0

          def fail(why):
              print(f"\n{why}", flush=True)
              for pattern in leftover:
                  subprocess.run(["pgrep", "-af", pattern])
              try:
                  os.killpg(pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass
              sys.exit(1)

          deadline = time.monotonic() + 600
          while not (answers(f"http://127.0.0.1:{api}/api/health/") and answers(f"http://localhost:{web}/")):
              if not pump(2):
                  fail("install.sh ended before both servers answered")
              if time.monotonic() > deadline:
                  fail("the two servers did not both answer within ten minutes")
          print("\n[ci] both servers answer; sending Ctrl-C", flush=True)
          os.write(fd, b"\x03")
          deadline = time.monotonic() + 60
          while pump(1):
              if time.monotonic() > deadline:
                  fail("the terminal was still held open a minute after Ctrl-C")
          _, status = os.waitpid(pid, 0)
          if not (os.WIFEXITED(status) and os.WEXITSTATUS(status) == 0):
              how = (f"exit status {os.WEXITSTATUS(status)}" if os.WIFEXITED(status)
                     else f"signal {signal.Signals(os.WTERMSIG(status)).name}")
              fail(f"install.sh ended with {how} after Ctrl-C, expected exit status 0")
          text = re.sub(r"\x1b\[[0-9;]*m", "", transcript.decode("utf-8", "replace"))
          said = sum("Shutting down" in line for line in text.splitlines())
          if said != 1:
              fail(f"'Shutting down' was printed {said} times, expected once")
          # A process that is still exiting is given a few seconds; one that
          # is still there after them was left running.
          for _ in range(10):
              alive = [p for p in leftover
                       if subprocess.run(["pgrep", "-f", p], capture_output=True).returncode == 0]
              if not alive:
                  break
              time.sleep(1)
          else:
              fail(f"still running after Ctrl-C: {', '.join(alive)}")
          print("[ci] Ctrl-C: exit status 0, one 'Shutting down', no runserver or vite left", flush=True)
          PY
      # Without Debian's venv package, `python3 -m venv` stops at ensurepip
      # and leaves a .venv with a python and no pip. The installer has to
      # rebuild that, not die at its pip step on every later run.
      - name: A half-created .venv is rebuilt, not reused
        run: |
          set -euo pipefail
          rm -rf .venv
          python3 -m venv --without-pip .venv
          ./install.sh --setup-only | tee /tmp/venv.log
          grep -q 'the existing \.venv has no working pip' /tmp/venv.log \
            || { echo "install.sh did not say it rebuilt the half-created .venv"; exit 1; }
          .venv/bin/python -m pip --version

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config -q
      - run: docker build -t conformiti-backend:ci ./backend
      - run: docker build -t conformiti-frontend:ci ./frontend
      # Two runs, because they take different paths through entrypoint.sh and
      # the first one is the one nothing used to cover: compose and both
      # installers always set SEED_DEMO_DATA, so a plain `docker run` of the
      # published image was the only caller that left it unset, and `set -u`
      # made that fatal after the migrations had already run (0.9.5e).
      - name: Backend image boots with no environment at all (SQLite, no services)
        run: |
          docker run -d --name bare -p 8000:8000 \
            -e DJANGO_SECRET_KEY_FILE=/app/secrets/key \
            conformiti-backend:ci
          for i in $(seq 1 60); do
            # The code, not curl's exit status: `curl -f` succeeds on a 3xx,
            # so a container redirecting everything to https looked healthy.
            if [ "$(curl -s -o /tmp/bare.json -w '%{http_code}' http://localhost:8000/api/health/)" = 200 ]; then
              cat /tmp/bare.json; echo; exit 0
            fi
            sleep 2
          done
          docker logs bare
          exit 1

      # An image that answers is not the same as an image that is safe to
      # answer with. Nothing in this repository ever ran it without
      # DJANGO_DEBUG, so nothing noticed that the code default is on (0.9.5f).
      - name: That container is not in DEBUG
        run: |
          set -euo pipefail
          # A here-string, not a pipe: grep -q exits at its first match, and
          # under pipefail the SIGPIPE'd `docker logs` failed this step with
          # the banner present (0.9.5k CI).
          grep -q "DEBUG=off" <<< "$(docker logs bare 2>&1)" \
            || { echo "the boot banner does not say DEBUG=off"; docker logs bare; exit 1; }
          # The browsable API is DEBUG-only, so it is the property under test
          # rather than the banner's opinion of itself.
          code=$(curl -s -o /tmp/api.html -w '%{http_code}' -H 'Accept: text/html' http://localhost:8000/api/)
          if grep -qi 'django rest framework\|browsable' /tmp/api.html; then
            echo "the browsable API is being served, so DEBUG is on (HTTP ${code})"
            head -40 /tmp/api.html
            exit 1
          fi
          echo "no browsable API (HTTP ${code})"

      - name: Backend image boots and answers /api/health/ (demo dataset seeded)
        run: |
          docker run -d --name api -p 8001:8000 \
            -e DJANGO_DEBUG=false -e DJANGO_SECRET_KEY_FILE=/app/secrets/key \
            -e BEHIND_TLS=false -e SEED_DEMO_DATA=true -e EMAIL_PROVIDER=console \
            conformiti-backend:ci
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /tmp/seeded.json -w '%{http_code}' http://localhost:8001/api/health/)" = 200 ]; then
              cat /tmp/seeded.json; echo; exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1

  e2e:
    name: End-to-end browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      # The suite starts the backend itself, from the repo-root venv the
      # Playwright config resolves.
      - run: python -m venv .venv && .venv/bin/pip install -r backend/requirements.txt
      - run: npm ci --no-fund --no-audit
        working-directory: frontend
      - run: npm ci --no-fund --no-audit
        working-directory: e2e
      - id: pw
        working-directory: e2e
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        working-directory: e2e
        if: steps.browsers.outputs.cache-hit == 'true'
      # Both authentication transports. The suite found three specs that had
      # quietly assumed the token was readable from localStorage.
      - run: npm test
        working-directory: e2e
        env:
          E2E_TRANSPORT: header
      - run: npm test
        working-directory: e2e
        env:
          E2E_TRANSPORT: cookie
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
          retention-days: 7

  # The stack as shipped, through nginx: sign in on the cookie transport,
  # upload evidence, read it back through X-Accel, back the installation up
  # with the shipped script, destroy it, restore it and read the same bytes
  # back. Until 0.9.5 nothing exercised the compose file end to end, and the
  # backup instructions in the README named a database user that did not
  # exist.
  compose:
    name: Compose stack, backup and restore
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEMO_PASSWORD: CiDemoPassword2026
      REDIS_PASSWORD: ciRedisSecret42
      PUBLIC_HOST: grc.example.test
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack (Redis password on, demo data seeded, a public host name)
        run: |
          # SEED_DEMO_DATA is off in the shipped compose file since 0.9.5b, so
          # this job asks for it: the steps below sign in as a demo account.
          # DJANGO_ALLOWED_HOSTS is what a production .env sets, and it names
          # neither localhost nor 127.0.0.1. Until the compose file added its
          # own names to the operator's, that left the backend's healthcheck
          # (127.0.0.1:8000) failing, so nothing behind it ever started, and
          # every step below signs in through localhost.
          printf 'DEMO_PASSWORD=%s\nREDIS_PASSWORD=%s\nSEED_DEMO_DATA=true\nDJANGO_ALLOWED_HOSTS=%s\n' \
            "$DEMO_PASSWORD" "$REDIS_PASSWORD" "$PUBLIC_HOST" > .env
          docker compose up -d --build
      - name: nginx answers /api/health/
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8080/api/health/ > /tmp/health.json 2>/dev/null; then break; fi
            sleep 3
          done
          cat /tmp/health.json; echo
          jq -e '.status == "ok" and .database == "ok"' /tmp/health.json > /dev/null
          docker compose ps
      - name: The public host name is served, and a name nobody listed is refused
        run: |
          set -euo pipefail
          # The stack turning healthy proves compose kept its own names next
          # to the one in .env. These prove the operator's name was kept as
          # well, and that the result is still a list rather than a wildcard.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $PUBLIC_HOST" http://localhost:8080/api/health/)
          test "$code" = 200 || { echo "Host $PUBLIC_HOST answered $code, expected 200"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: not-listed.example.test' http://localhost:8080/api/health/)
          test "$code" = 400 || { echo "an unlisted Host answered $code, expected 400"; exit 1; }
      - name: Sign in through nginx, upload a document, download it through X-Accel
        run: |
          set -euo pipefail
          jar=/tmp/cookies.txt
          # Signing in is CSRF-checked in cookie mode since 0.9.5f, because
          # it is one of the two endpoints that SET the auth cookies and so
          # never reached the check inside cookie authentication. This is the
          # sequence INSTALL.md gives an API client, run here so the
          # documentation and the product are tested by the same steps.
          curl -fsS -c "$jar" http://localhost:8080/api/auth/config/ > /dev/null
          login_csrf=$(awk '$6 ~ /csrftoken$/ {print $7}' "$jar" | tail -1)
          test -n "$login_csrf"
          curl -fsS -b "$jar" -c "$jar" -H "X-CSRFToken: $login_csrf" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$DEMO_PASSWORD\"}" \
            http://localhost:8080/api/auth/token/ > /tmp/login.json
          # Cookie mode keeps the tokens out of the body; only the CSRF token is readable.
          if grep -q '"access"' /tmp/login.json; then echo "tokens leaked into the login body"; exit 1; fi
          csrf=$(awk '$6 == "csrftoken" {print $7}' "$jar")
          test -n "$csrf"
          folder=$(curl -fsS -b "$jar" http://localhost:8080/api/folders/tree/ | jq -r '.[0].id')
          test "$folder" != "null"
          head -c 65536 /dev/urandom > /tmp/evidence.bin
          doc=$(curl -fsS -b "$jar" -H "X-CSRFToken: $csrf" \
            -F "folder=$folder" -F "name=CI evidence" -F "file=@/tmp/evidence.bin;filename=evidence.bin" \
            http://localhost:8080/api/documents/ | jq -r '.id')
          test "$doc" != "null"
          echo "doc=$doc" >> "$GITHUB_ENV"
          curl -fsS -b "$jar" -D /tmp/dl.headers -o /tmp/dl.bin "http://localhost:8080/api/documents/$doc/download/"
          cmp /tmp/evidence.bin /tmp/dl.bin
          grep -qi '^content-disposition: attachment' /tmp/dl.headers
          if grep -qi '^x-accel-redirect' /tmp/dl.headers; then echo "nginx passed the X-Accel header through"; exit 1; fi
          # The file is served by nginx from the internal location, never by gunicorn.
          grep -q '^404$' <<< "$(curl -s -o /dev/null -w '%{http_code}\n' http://localhost:8080/protected-media/)"
          curl -fsS -b "$jar" http://localhost:8080/api/signing-keys/ > /tmp/keys-before.json
      - name: Back up with the shipped script
        run: |
          scripts/backup.sh /tmp/backup
          for f in db.sql.gz media.tgz secrets.tgz tree.tgz; do test -s "/tmp/backup/$f"; done
          grep -q package_signing_key <<< "$(tar tzf /tmp/backup/secrets.tgz)"
      - name: Destroy the installation and restore it
        run: |
          docker compose down -v
          scripts/restore.sh /tmp/backup
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8080/api/health/ > /dev/null 2>&1; then break; fi
            sleep 3
          done
          docker compose ps
      - name: The document is back byte for byte, under the same signing key
        run: |
          set -euo pipefail
          jar=/tmp/cookies2.txt
          # Signing in after the restore, the same way as before it.
          curl -fsS -c "$jar" http://localhost:8080/api/auth/config/ > /dev/null
          login_csrf=$(awk '$6 ~ /csrftoken$/ {print $7}' "$jar" | tail -1)
          test -n "$login_csrf"
          curl -fsS -b "$jar" -c "$jar" -H "X-CSRFToken: $login_csrf" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$DEMO_PASSWORD\"}" \
            http://localhost:8080/api/auth/token/ > /dev/null
          curl -fsS -b "$jar" -o /tmp/dl2.bin "http://localhost:8080/api/documents/$doc/download/"
          cmp /tmp/evidence.bin /tmp/dl2.bin
          curl -fsS -b "$jar" http://localhost:8080/api/signing-keys/ > /tmp/keys-after.json
          cmp /tmp/keys-before.json /tmp/keys-after.json
      - name: Logs
        if: failure()
        run: docker compose logs --no-color | tail -n 400
