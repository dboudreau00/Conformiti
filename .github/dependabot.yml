version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # Conformiti tracks the Django LTS line on purpose: a compliance
      # deployment is long-lived, and 5.2 LTS has security support until
      # April 2028 while a feature release has roughly eight months. Moving
      # to 6.x is a deliberate release decision. The next
      # move is to 6.2 LTS. See PREREQUISITES.md.
      - dependency-name: Django
        update-types: ["version-update:semver-major"]
      # botocore (under boto3) requires python-dateutil<3, so a 3.x or 4.x
      # floor cannot be installed and fails every job (PR #44). Take the next
      # major when botocore allows it.
      - dependency-name: python-dateutil
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      javascript:
        patterns: ["*"]
    ignore:
      # Tailwind 4 replaces the JavaScript config with a CSS-first `@theme`
      # engine. The theme system in src/styles/index.css is the product's
      # entire visual identity, so that migration gets its own release with a
      # screenshot diff behind it. Measured, it also produced 33% MORE CSS
      # here, so there is no size argument for rushing it.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      e2e:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    ignore:
      # The backend image follows the Python versions Django 5.2 LTS supports
      # (3.10 to 3.14) and the CI test matrix covers. Python 3.15 waits until
      # both do (PR #45).
      - dependency-name: python
        versions: [">=3.15"]
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
