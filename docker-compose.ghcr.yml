# Run the published images instead of building from source.
#
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
#
# Everything else comes from docker-compose.yml: the environment, the volumes,
# the healthchecks and the published ports (nginx on CONFORMITI_PORT, default
# 8080, and the API on 127.0.0.1 at CONFORMITI_API_PORT, default 8000). An
# installation started this way is the same installation, assembled from
# artefacts rather than from a build.
#
# nginx's configuration is the exception: it is baked into the frontend image,
# so editing frontend/nginx.conf (to raise client_max_body_size, say) changes
# nothing on this path. To run an edited copy, mount it from a third file of
# your own and name that file after these two on every command:
#
#   services:
#     frontend:
#       volumes:
#         - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
#
# After a later edit, restart the frontend service so nginx reads it again.
#
# `latest` follows the newest release. Pin a version for production, in .env
# beside COMPOSE_FILE, which names these two files once so that the short
# forms (`docker compose up -d`, and scripts/restore.sh, which uses them)
# stay on the images:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.ghcr.yml
#   CONFORMITI_VERSION=0.9.5l
#
# (Separate the files with `;` for Docker Desktop's Windows docker.exe.) A
# value given inline, `CONFORMITI_VERSION=0.9.5l docker compose up -d`, lasts
# for that one command: the next one, scripts/restore.sh included, goes back
# to the pin in .env, or to `latest` without one. An exported value overrides
# .env for as long as the shell keeps it, so unset it once the pin is there.
#
# `build: !reset null` removes the build stanza the base file sets, so these
# services can only ever run what was pulled. It needs Compose v2.24 or newer.
services:
  backend:
    build: !reset null
    image: ghcr.io/dboudreau00/conformiti-backend:${CONFORMITI_VERSION:-latest}

  worker:
    build: !reset null
    image: ghcr.io/dboudreau00/conformiti-backend:${CONFORMITI_VERSION:-latest}

  beat:
    build: !reset null
    image: ghcr.io/dboudreau00/conformiti-backend:${CONFORMITI_VERSION:-latest}

  frontend:
    build: !reset null
    image: ghcr.io/dboudreau00/conformiti-frontend:${CONFORMITI_VERSION:-latest}
